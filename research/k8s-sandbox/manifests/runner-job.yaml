apiVersion: batch/v1
kind: Job
metadata:
  name: namzu-e2e-runner
  namespace: namzu-e2e
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        namzu.ai/component: host
    spec:
      serviceAccountName: namzu-sandbox-host
      restartPolicy: Never
      containers:
        - name: runner
          image: localhost/namzu-e2e-runner:kind
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMZU_E2E_NAMESPACE
              value: namzu-e2e
            - name: NAMZU_E2E_TEMPLATE
              value: namzu-task
            - name: NAMZU_E2E_POOL
              value: namzu-task-pool
            - name: NAMZU_E2E_ACQUIRE_COUNT
              value: '20'
            - name: NAMZU_E2E_LEASE_TTL_SECONDS
              value: '60'
