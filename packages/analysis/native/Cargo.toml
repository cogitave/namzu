[package]
name = "namzu-analysis-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only native binary analysis sidecar for Namzu: NDJSON over stdio."
license = "FSL-1.1-MIT"
publish = false

[lib]
name = "namzu_analysis_native"
path = "src/lib.rs"

[[bin]]
name = "namzu-analysis-native"
path = "src/main.rs"

[dependencies]
memchr = "=2.8.3"
memmap2 = "=0.9.12"
object = { version = "=0.40.0", default-features = false, features = ["read", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
symbolic-common = { version = "=13.9.0", default-features = false }
symbolic-demangle = { version = "=13.9.0", default-features = false, features = ["cpp", "msvc", "rust"] }

[dev-dependencies]
object = { version = "=0.40.0", default-features = false, features = ["read", "std", "write"] }
tempfile = "=3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false
