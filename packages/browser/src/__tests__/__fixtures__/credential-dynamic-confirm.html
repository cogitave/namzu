<!doctype html><html><head><title>Dynamic confirmation</title></head><body>
<h1>Dynamic confirmation</h1>
<button id="prompt" type="button">Open confirmation</button>
<p id="result">nothing yet</p>
<script>
document.getElementById('prompt').addEventListener('click', () => {
  const password = document.createElement('input')
  password.type = 'password'
  password.setAttribute('aria-label', 'Password')
  password.value = 'stored-password-secret'
  document.body.appendChild(password)
  if (confirm('Submit newly added credentials?')) {
    location.href = '/credential-submit?from=dynamic-confirm'
  } else {
    document.getElementById('result').textContent = 'cancelled'
  }
})
</script>
</body></html>
