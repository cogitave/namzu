<!doctype html><html><head><title>Associated credential form</title></head><body>
<h1>Associated credential form</h1>
<form id="profile" action="/credential-submit" method="get">
  <label>Email <input name="email" type="email" value="ada@example.com"></label>
  <button type="submit">Save associated profile</button>
</form>
<label>Password outside form <input name="password" type="password" form="profile" value="stored-password-secret"></label>
</body></html>
