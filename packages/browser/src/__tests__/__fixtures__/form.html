<!doctype html><html><head><title>Order form</title></head><body>
<h1>Order</h1>
<form action="/form-result" method="get">
<label>Full name <input name="name"></label>
<label>Quantity <input name="qty" type="number"></label>
<label>Colour <select name="colour"><option value="r">Red</option><option value="g">Green</option><option value="b">Blue</option></select></label>
<label><input type="checkbox" name="gift" value="yes"> Gift wrap</label>
<label>Notes <textarea name="notes"></textarea></label>
<button type="submit">Place order</button>
</form>
</body></html>
