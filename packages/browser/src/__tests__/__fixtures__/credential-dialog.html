<!doctype html><html><head><title>Profile confirmation</title></head><body>
<h1>Profile confirmation</h1>
<label>Password <input type="password" value="stored-password-secret"></label>
<button id="prompt" type="button">Ask to save profile</button>
<p id="result">nothing yet</p>
<script>
document.getElementById('prompt').addEventListener('click', () => {
  if (confirm('Submit stored credentials?')) {
    location.href = '/credential-submit?from=dialog'
  } else {
    document.getElementById('result').textContent = 'cancelled'
  }
})
</script>
</body></html>
