<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>New Tab · Namzu</title>
    <link rel="stylesheet" href="home.css" />
  </head>
  <body>
    <header><img class="brand" src="wordmark.svg" width="126" height="24" alt="Namzu" /><span class="workspace-label">Pal workspace</span></header>
    <main>
      <time id="clock" aria-label="Current time"></time>
      <p id="date"></p>
      <h1>Your workspace, ready to go.</h1>
      <form id="search" action="https://duckduckgo.com/" method="get">
        <label for="query">Search the web or enter a website address</label>
        <input id="query" name="q" type="text" placeholder="Search or enter a website" autocomplete="off" />
        <button type="submit" aria-label="Search or open website">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
      </form>
      <section class="apps" aria-label="Installed applications" id="apps"></section>
      <output class="hint" id="app-status" aria-live="polite"></output>
    </main>
    <script src="home.js"></script>
  </body>
</html>
