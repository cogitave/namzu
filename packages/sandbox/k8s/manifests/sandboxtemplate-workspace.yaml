# SandboxTemplate for PERSISTENT workspaces: a block-mode disk baked into
# `volumeClaimTemplates` from creation. `createKubernetesWorkspace()`
# (packages/sandbox/src/backends/kubernetes/workspace.ts) POSTs a `Sandbox`
# directly from this template — NEVER through a `SandboxClaim`, and this
# template is therefore NEVER referenced by a `SandboxWarmPool` either.
# Both restrictions are the same fact twice: `volumeClaimTemplates` is
# CEL-immutable on a `Sandbox`, and a claim carrying one is forced to
# cold-start upstream, so "diskless pool, attach a disk to it later" is not
# expressible in this API at all — see
# docs/sdk/kubernetes-sandbox.md#the-disk-is-fixed-at-creation-and-must-be-block.
#
# BEFORE APPLYING, in addition to sandboxtemplate-task.yaml's own list:
#   - `storageClassName` MUST provision `volumeMode: Block`. The default
#     StorageClass on a stock kind cluster (`standard`, rancher.io/local-path)
#     CANNOT — the PVC stays Pending forever. Confirm with `kubectl get
#     storageclass` and a real cluster's CSI driver docs.
#   - `resources.requests.storage` is a placeholder; size for the largest
#     workspace this deployment expects to run, since it is set once at
#     creation and resizing an existing workspace's disk is out of scope
#     (see the docs page).
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: namzu-workspace
  namespace: namzu-sandboxes
spec:
  podTemplate:
    metadata:
      labels:
        # Same label, same rule as sandboxtemplate-task.yaml: MUST equal
        # this SandboxTemplate's own `metadata.name`.
        sandbox.namzu.ai/template: namzu-workspace
    spec:
      runtimeClassName: kata-qemu
      # How long the kubelet gives this pod to stop before it SIGKILLs it —
      # and therefore the whole budget the disk's last writes have to reach
      # the device in. It covers BOTH halves of that, one after the other:
      # the `preStop` hook below (a `syncfs` over the workspace, then the
      # signal to PID 1 and a wait for it), and the agent's own termination
      # drain afterwards (stop every process it is running, `syncfs` again,
      # exit 0 — bounded by NAMZU_AGENT_SHUTDOWN_DEADLINE_MS below).
      #
      # 30 IS NOT A MEASURED NUMBER. It is a budget: 15s for the agent's
      # bounded drain and flush, and the rest for the hook's own flush and
      # for the kubelet's overhead. Nothing in this repo can measure the
      # right value — it depends on the runtime class, the storage class and
      # how much a workload leaves dirty — so measure it on YOUR cluster,
      # the way #484 measured the old one: delete a pod and compare its
      # `deletionTimestamp` with the container's `finishedAt` and exit code.
      #
      # What it costs, and the two bounds it sits between:
      #   - On a VM runtime the pod stop was measured to last the WHOLE grace
      #     period even when the container was gone within a second, so this
      #     value is roughly what every `suspend()` will take there. The old
      #     value was 5.
      #   - It must stay well below the host's `readyTimeoutMs` (default
      #     60000ms), which bounds how long `suspend()` waits for the pod to
      #     be gone. A grace period at or above it turns every suspend into a
      #     `KubernetesWorkspaceSuspendTimeoutError`.
      #   - A longer drain also widens the window in which a host restarting
      #     against this workspace adopts a pod that is still draining.
      #   - The hook's own `syncfs` is INSIDE this budget and is not
      #     bounded (there is no POSIX-portable way to bound it), so the
      #     relationship is `sync-time + the agent's drain <= this`. Time a
      #     `sync -f` over a loaded workspace mount and add
      #     NAMZU_AGENT_SHUTDOWN_DEADLINE_MS to it; that sum, not 30, is
      #     what this has to clear.
      terminationGracePeriodSeconds: 30
      containers:
        - name: agent
          image: REPLACE_WITH_YOUR_REGISTRY/namzu-sandbox-agent:TAG
          ports:
            - name: agent
              containerPort: 1024
              protocol: TCP
          # The flush that happens BEFORE the stop signal, which is the
          # only mechanism that does not depend on the signal being
          # delivered and handled in time. `entrypoint.sh prestop` (the same
          # script this image's ENTRYPOINT runs, given a verb) syncs the
          # workspace filesystem, then signals PID 1 and waits for it, so
          # the agent's own drain runs inside this hook rather than racing
          # the kill that follows it.
          #
          # HOW LONG IT WAITS IS DERIVED, NOT SET HERE. The kubelet runs
          # this hook, waits for it to return, and only THEN sends its own
          # stop signal to PID 1 — so a hook whose wait is shorter than
          # NAMZU_AGENT_SHUTDOWN_DEADLINE_MS below would end while the agent
          # is still draining and hand it a signal the kubelet sent only
          # because the hook gave up. The script therefore waits
          # ceil(NAMZU_AGENT_SHUTDOWN_DEADLINE_MS / 1000) + 2 seconds — 17
          # at the value below — and raising that deadline raises this with
          # it. NAMZU_PRESTOP_WAIT_SECONDS overrides the derivation and is
          # deliberately NOT set here: pinning it to a literal would freeze
          # the relationship, so an operator who raises the deadline alone
          # would silently get the old, too-short wait back.
          #
          # WHAT IT SIGNALS IS CHECKED FIRST. `kill` is a POSIX shell
          # builtin, so the script is the only place that check can live,
          # and the pid it defaults to is 1 — the machine's own init
          # anywhere but inside this container's pid namespace. The hook
          # reads /proc/<pid>/comm and signals only a process named like
          # the init this image starts (`tini`). A derived image booting a
          # different init sets NAMZU_PRESTOP_INIT_NAME; one that does not
          # gets a line on the hook's stderr and no signal, keeping the
          # `syncfs` above and the agent's own handler as the flush.
          #
          # Measured on a VM runtime in #484: the container was killed with
          # exit 137 about a second into a stop whose grace period was 5s,
          # while `kill -TERM 1` from INSIDE the guest ended it cleanly with
          # exit 0 in about a second. Whether the kubelet runs a preStop
          # hook at all under that runtime class was NOT measured, which is
          # exactly why the agent's own SIGTERM handler performs the same
          # drain and flush independently: neither mechanism is trusted to
          # be the one that works.
          #
          # EXPECT A `FailedPreStopHook` WARNING ON EVERY STOP THAT WORKED.
          # The hook runs inside the container's pid namespace and ends PID
          # 1 of it; the kernel then SIGKILLs everything left in that
          # namespace, the hook included, so a hook that did its job is one
          # the kubelet records as having died. It is the success path, not
          # a defect: the flush and the drain both finished before PID 1
          # could exit. The alternative — returning before PID 1 is gone —
          # is the race the hook exists to close.
          lifecycle:
            preStop:
              exec:
                command: ['/entrypoint.sh', 'prestop']
          securityContext:
            # Load-bearing here, unlike on the task template: this pod DOES
            # mount a device (NAMZU_WORKSPACE_DEVICE below), so
            # entrypoint.sh's blkid/mkfs.ext4/mount sequence actually runs
            # and needs CAP_SYS_ADMIN before it drops every capability and
            # execs into the agent. See k8s/entrypoint.sh.
            privileged: true
          env:
            - name: NAMZU_AGENT_TCP_PORT
              value: '1024'
            - name: NAMZU_WORKSPACE_ROOT
              value: /workspace
            - name: NAMZU_WORKSPACE_DEVICE
              # Must equal the volumeDevices entry's devicePath below.
              # entrypoint.sh formats it with mkfs.ext4 ONLY the first time
              # (blkid reports no filesystem yet) and mounts it at
              # NAMZU_WORKSPACE_ROOT on every boot after that, including
              # every resume — see entrypoint.sh's header comment for why
              # an unconditional mkfs here would be the single most
              # destructive possible bug in this whole backend.
              value: /dev/namzu-workspace
            # How long a command the host asked to detach from may run, and
            # how much of its output the guest keeps for a host that comes
            # back for it. All three are shown at their DEFAULTS: deleting
            # them changes nothing, and they are here so an operator can see
            # what the knobs are without reading the agent.
            #
            # NAMZU_SANDBOX_MAX_TIMEOUT_MS is the ceiling on the caller's own
            # `timeout`, refused rather than silently shortened. Raise it for
            # a workspace that runs a suite longer than thirty minutes.
            - name: NAMZU_SANDBOX_MAX_TIMEOUT_MS
              value: '1800000'
            # Retained output costs heap in the same 512Mi the workload
            # shares, so it is bounded twice over: per execution, and by how
            # many executions may retain at once. 1 MiB x 32 = 32 MiB worst
            # case. Only a command started with detach retains anything.
            - name: NAMZU_AGENT_EXECUTION_LOG_BYTES
              value: '1048576'
            - name: NAMZU_AGENT_MAX_RETAINED_OUTPUT_LOGS
              value: '32'
            # How long a detached command's record and output outlive it —
            # the window in which a redeployed host can still come back and
            # read the result. Idempotent re-starts of the same execution id
            # end here too.
            - name: NAMZU_AGENT_EXECUTION_RETAINED_TTL_MS
              value: '600000'
            # Sessions: a terminal or background program that outlives the
            # host process that started it. Shown at their DEFAULTS like the
            # four above, and bounded the same way — per session, and by how
            # many sessions may exist: 1 MiB x 16 = 16 MiB worst case, in the
            # same 512Mi the workload shares. A session exists only when a
            # caller NAMES one, so a deployment that never asks for one pays
            # nothing here.
            - name: NAMZU_AGENT_MAX_SESSIONS
              value: '16'
            - name: NAMZU_AGENT_SESSION_LOG_BYTES
              value: '1048576'
            # How long an exited session's record and output outlive the
            # program — the window in which a redeployed host can still read
            # its tail and its exit status.
            - name: NAMZU_AGENT_SESSION_TERMINAL_TTL_MS
              value: '600000'
            # Termination, the other half of terminationGracePeriodSeconds
            # above. Both are shown at their DEFAULTS: deleting them changes
            # nothing, and they are here so an operator changing the grace
            # period can see the two budgets that have to fit inside it.
            #
            # NAMZU_AGENT_SHUTDOWN_DEADLINE_MS bounds the WHOLE SIGTERM
            # handler — stop accepting connections, stop every process the
            # guest is running, flush, exit. The agent exits when it expires
            # whatever is still in flight, because a handler that waited
            # forever would hold the pod open until the kubelet's SIGKILL.
            # It is also the ONLY bound: a repeat stop signal is logged and
            # ignored rather than cutting the drain short, since in a
            # stopping pod the second one is the kubelet's own and not
            # anybody asking for a shorter wait. And it is what the preStop
            # hook's wait above is derived from, so raising it raises both.
            - name: NAMZU_AGENT_SHUTDOWN_DEADLINE_MS
              value: '15000'
            # And how long ONE flush (`sync -f` on the workspace mount) may
            # take before it is reported unconfirmed — both the one the
            # handler runs and the one `suspend()` asks for over the wire.
            # Raise it for a workspace that leaves gigabytes dirty.
            - name: NAMZU_AGENT_FLUSH_TIMEOUT_MS
              value: '10000'
            - name: NAMZU_AGENT_BIND_TOKEN
              # Same rule as the task template: the pod's own uid, never a
              # value this manifest invents or shares across instances. A
              # workspace is never pooled, so there is no "shared replica"
              # to worry about here either way, but the rule does not bend
              # for that — see sandboxtemplate-task.yaml's own comment.
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # Kubernetes wires a raw block PVC to the container by
          # `volumeDevices`, not `volumeMounts` — no filesystem exists on it
          # yet for the kubelet to mount; `entrypoint.sh` is what puts one
          # there. `name` matches `volumeClaimTemplates[].metadata.name`
          # below directly (StatefulSet-style implicit binding) — no
          # `volumes:` entry is needed or accepted here.
          volumeDevices:
            - name: workspace-disk
              devicePath: /dev/namzu-workspace
  service: true
  volumeClaimTemplates:
    - metadata:
        name: workspace-disk
      spec:
        accessModes:
          - ReadWriteOnce
        volumeMode: Block
        # REPLACE with a StorageClass that provisions Block volumes on
        # this cluster.
        storageClassName: REPLACE_WITH_A_BLOCK_CAPABLE_STORAGECLASS
        resources:
          requests:
            storage: 10Gi
  # COVERS NO WORKSPACE POD. The controller translates this block into a
  # managed NetworkPolicy selecting `agents.x-k8s.io/sandbox-template-ref-hash`,
  # which it writes only onto a Sandbox adopted out of a SandboxWarmPool — and
  # a workspace is NEVER pooled (see this file's own header): it is always a
  # Sandbox the backend POSTs directly. So the ingress rule below protects
  # nothing here, and the policy that does is the standalone
  # `networkpolicy.yaml`, which selects `sandbox.namzu.ai/template` by
  # existence and which the backend now verifies before every create.
  #
  # Kept rather than deleted so this template stays a faithful copy of the
  # task template's shape (one image, one entrypoint, one reviewed set of
  # rules) and so an operator who later pools a disk-less variant of it gets
  # the same second layer the task template gets. It is a second layer that
  # happens to be empty here, never the boundary.
  networkPolicyManagement: Managed
  networkPolicy:
    ingress:
      - from:
          - podSelector:
              matchLabels:
                namzu.ai/component: host
        ports:
          - protocol: TCP
            port: 1024
    egress:
      # DNS only — see sandboxtemplate-task.yaml's matching block for the
      # full explanation of why this list is not additive to a baseline.
      #
      # DELETE the rule below if config.egress.engine is 'cilium' AND
      # config.egress.ciliumNarrowing.dnsNames is set — it cancels the
      # narrowed CiliumNetworkPolicy's own L7 DNS restriction under Cilium's
      # rule precedence (see networkpolicy.yaml's matching comment). Leave it
      # for `engine: 'core'` or a cilium deployment with no DNS-name
      # narrowing on.
      #
      # Left in place with DNS-name narrowing on, the union check now
      # refuses the create rather than silently doing nothing (default
      # `egress.verify: 'union'`; `'named-object-only'` still needs this
      # rule deleted by hand — see networkpolicy.yaml's matching comment).
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
        ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
