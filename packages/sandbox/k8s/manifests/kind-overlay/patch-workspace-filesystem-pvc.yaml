# See patch-task-no-runtimeclass.yaml's header for why `containers` and
# `volumeClaimTemplates` are given in full here rather than as sparse
# diffs — both are array-valued keys under a JSON merge patch.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: namzu-workspace
  namespace: namzu-sandboxes
spec:
  podTemplate:
    spec:
      runtimeClassName: null
      containers:
        - name: agent
          image: REPLACE_WITH_YOUR_REGISTRY/namzu-sandbox-agent:TAG
          ports:
            - name: agent
              containerPort: 1024
              protocol: TCP
          # REPEATED here, not inherited from the base template: this patch
          # gives `containers` in full (see the header), so everything the
          # base's container carries that this pod still needs has to be
          # stated again — and the preStop hook is one of those, not a
          # deliberate omission. Without it a workspace pod on kind keeps only
          # the agent's own SIGTERM handler and nothing flushes the workspace
          # before the kubelet's stop signal, which is the half of #484 this
          # overlay would then never exercise. Verbatim from
          # ../sandboxtemplate-workspace.yaml, where the long explanation of
          # what the verb does and what it checks before it signals lives.
          # What is NOT repeated is a SCALAR key this patch leaves alone:
          # `terminationGracePeriodSeconds: 30` is not an array, so the base's
          # value stands and the hook's wait still fits inside it.
          #
          # `env` IS an array, so the list below REPLACES the base's wholesale
          # and inherits nothing through it either — the same rule as
          # `containers`, one level down, which is why its sibling
          # patch-task-no-runtimeclass.yaml states that rule outright rather
          # than leaving it to this header. What the entries omitted here fall
          # back to is the AGENT's own defaults, and those are the values the
          # base template shows: it lists them at their defaults deliberately,
          # so the number the hook above derives its 17s wait from is the same
          # 15000 whether this overlay is applied or not.
          lifecycle:
            preStop:
              exec:
                command: ['/entrypoint.sh', 'prestop']
          securityContext:
            # This overlay's PVC is Filesystem-mode, mounted ready by
            # kubelet through the volumeMounts entry below — it sets no
            # NAMZU_WORKSPACE_DEVICE, so entrypoint.sh's blkid/mkfs.ext4/
            # mount branch never runs here either, unlike the base
            # sandboxtemplate-workspace.yaml this overlay patches. That
            # makes this pod behave exactly like a task pod at startup, so
            # it takes the identical restricted shape — see
            # ../sandboxtemplate-task.yaml's own comment.
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: NAMZU_AGENT_TCP_PORT
              value: '1024'
            - name: NAMZU_WORKSPACE_ROOT
              value: /workspace
            - name: NAMZU_AGENT_BIND_TOKEN
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            # No NAMZU_WORKSPACE_DEVICE: the PVC below is Filesystem-mode,
            # which kubelet mounts as a ready filesystem directly.
            # entrypoint.sh's blkid/mkfs.ext4/mount branch only runs when
            # this variable names an actual block device, so leaving it
            # unset skips that branch cleanly — nothing to disable.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # A normal filesystem mount, not `volumeDevices` — the base
          # manifest's raw-block wiring does not apply to this overlay's
          # PVC at all.
          volumeMounts:
            - name: workspace-disk
              mountPath: /workspace
  volumeClaimTemplates:
    - metadata:
        name: workspace-disk
      spec:
        accessModes:
          - ReadWriteOnce
        # The base manifest's whole reason to exist (a raw block device
        # entrypoint.sh formats and mounts itself) does not hold on kind:
        # `standard` (rancher.io/local-path) cannot provision `Block` at
        # all — the PVC stays `Pending` forever. `Filesystem` is what
        # local-path actually provisions.
        volumeMode: Filesystem
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi
