# ServiceAccount + Role + RoleBinding for the namzu host process that
# constructs `createSandboxProvider({ backend: { tier: 'microvm', service:
# 'kubernetes', access: { inCluster: true }, ... } })` and runs the
# acceptance scripts under ../scripts/. Namespace-scoped on purpose — no
# ClusterRole, no wildcard verb, exactly the verbs actually issued.
#
# No consumer role is published upstream by agent-sandbox itself; this is
# this repo's own minimal grant, read off two places:
#   - The backend's own call sites (packages/sandbox/src/backends/
#     kubernetes/{index,workspace,egress-policy,ingress-policy}.ts via
#     k8s-client.ts): sandboxclaims create/get/list/patch/delete (`list` is
#     releaseKubernetesTaskSandboxes' crash-recovery read and
#     readKubernetesTaskCapacity's pool-membership read), sandboxes
#     create/get/list/patch/delete, sandboxtemplates get, sandboxwarmpools
#     get (readKubernetesTaskCapacity's headroom read), pods get/list,
#     networkpolicies list (the ingress check, on by default, before every
#     create — and the egress UNION check, on by default whenever
#     `config.egress` is set) plus networkpolicies get (the egress
#     named-object check, also only when `config.egress` is set), and the
#     same two verbs on ciliumnetworkpolicies for a deployment that declares
#     `engine: 'cilium'` — both are granted below; a cluster with no Cilium
#     CRDs installed simply never matches that rule.
#   - ../scripts/acquire-p50.mjs's own diagnostic: it reads the
#     SandboxWarmPool's `status.readyReplicas` before timing so a cold,
#     still-warming pool cannot masquerade as a fast acquire — the same
#     object the backend itself now reads for the same reason, so
#     `sandboxwarmpools: get` has two callers rather than being the
#     script's alone.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: namzu-sandbox-host
  namespace: namzu-sandboxes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: namzu-sandbox-host
  namespace: namzu-sandboxes
rules:
  # `list` is the crash-recovery verb: releaseKubernetesTaskSandboxes finds
  # a crashed predecessor's claims by label before deleting them, and
  # readKubernetesTaskCapacity counts every claim bound to the configured
  # pool. Neither reachable without it — a claim's own name is
  # client-generated per acquire, so nothing else in the backend needs to
  # list the collection to find one it already knows the name of.
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxclaims]
    verbs: [create, get, list, patch, delete]
  # `list` is the workspace inventory's alone: listKubernetesWorkspaces
  # reads the sandboxes collection so a retention pass can see every
  # workspace without resuming one. Nothing else in the backend lists
  # sandboxes — every other read is a GET by a name it already knows.
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [create, get, list, patch, delete]
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxtemplates]
    verbs: [get]
  # A backend need, not a script's: readKubernetesTaskCapacity reads the
  # configured pool's `status.readyReplicas`/`spec.replicas` before
  # admitting more work. ../scripts/acquire-p50.mjs's own readiness check
  # reads the same object for the same reason — it just predates this verb
  # having a home in the shipped backend.
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxwarmpools]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
  # `list`, not `get`, is what BOTH enumerating checks need: each has to read
  # every policy in the namespace and evaluate its selector against the pod's
  # own labels, because a GET by name proves an object exists and not that it
  # selects these pods. The ingress check runs before every create unless the
  # deployment sets `ingress: 'unverified'`; the egress union check runs
  # whenever `config.egress` is set, unless the deployment sets
  # `egress.verify: 'named-object-only'`. `get` is the egress NAMED-object
  # check's, and is exercised only when a deployment sets `config.egress`.
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list]
  # The same two verbs, for a deployment that declares `engine: 'cilium'` on
  # either check — see the header comment. A cluster with no Cilium CRDs
  # installed simply never matches this rule; granting it costs nothing
  # there.
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: namzu-sandbox-host
  namespace: namzu-sandboxes
subjects:
  - kind: ServiceAccount
    name: namzu-sandbox-host
    namespace: namzu-sandboxes
roleRef:
  kind: Role
  name: namzu-sandbox-host
  apiGroup: rbac.authorization.k8s.io
