# Windows installer for Namzu Desktop. Run through scripts/stage-installer.mjs, which
# assembles the flat project this file describes (see docs/cli/desktop.md, "Installing and updating").
appId: com.cogitave.namzu
productName: Namzu
copyright: Namzu Contributors
artifactName: Namzu-Setup-${version}.${ext}
directories:
  output: out
  # build/icon.ico and build/icon.png come from scripts/generate-icon.mjs.
  buildResources: build
# Identity: electron-builder writes the NSIS install folder from productName and Electron derives
# app.getPath('userData') from the same name, so an installed build uses %APPDATA%\Namzu exactly
# like the development app does. Do not rename productName without migrating that folder.
asar: true
files:
  - package.json
  - dist/**
  - '!**/*.map'
  - '!**/*.d.ts'
  - '!**/*.d.cts'
  - '!**/*.test.*'
  - '!dist/dev/**'
# node_modules cannot travel through extraResources; this hook adds the CLI's.
afterPack: installer-after-pack.cjs
extraResources:
  - from: extra/cli
    to: cli
  - from: extra/python
    to: python
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
  # Unsigned for now: no publisherName, so the installer shows SmartScreen's
  # "unknown publisher" warning and the updater checks sha512 integrity only.
  signAndEditExecutable: true
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Namzu
  uninstallDisplayName: Namzu
  runAfterFinish: true
# The update feed baked into resources/app-update.yml: a rolling GitHub release named
# desktop-latest, read through the generic provider because the repository's own "latest"
# release belongs to the npm packages. Always build with --publish never (the generic provider
# cannot upload); .github/workflows/desktop-release.yml uploads the files with gh.
# GitHub's asset host does not answer multi-range requests, so differential downloads use one range.
publish:
  provider: generic
  url: https://github.com/cogitave/namzu/releases/download/desktop-latest/
  useMultipleRangeRequest: false
