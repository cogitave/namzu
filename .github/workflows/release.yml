name: Release

# Runs on every push to main — both direct pushes and merge commits from
# PRs. This workflow is self-contained: it can run the full validation
# before touching the Changesets action, so it can stand alone without the
# pre-merge ci.yml run.
#
# Per PR merge cycle:
#   - PR opened:   ci.yml runs (pre-merge gate)
#   - PR merged:   release.yml runs (post-merge validation + publish)
#
# ## When the validation is skipped
#
# A merge usually lands a tree ci.yml has already validated: the PR's run built
# `refs/pull/N/merge`, and when `main` did not move before the merge, the tree
# on `main` is byte-identical to it. Running every gate again measures nothing
# new and holds the publish back by twenty to thirty minutes.
#
# So the first step asks `.github/scripts/find-validated-tree.mjs` whether the
# pushed commit's tree (`git rev-parse HEAD^{tree}`) carries a
# `validated-tree-<tree>` artifact from a ci.yml run that concluded success, on
# a pull_request or merge_group event, from this repository and not a fork,
# that provably executed the `ci.yml` this commit carries. The artifact's name
# is chosen by whichever ci.yml ran, and a pull_request run executes the file
# in `refs/pull/N/merge`, which the PR's BASE branch can supply: a PR from an
# unchanged branch into a branch whose only change is a forged ci.yml runs the
# forged file while its head still carries the reviewed one. `main`'s ruleset
# requires a review but no status check, so such a throwaway PR would
# otherwise switch off every gate here for a tree another PR lands. The run
# object cannot tell the two apart (its `pull_requests` lists only PRs open
# now, and empty once the PR merged), so the record carries the run's workflow
# OIDC token. The helper verifies its signature against GitHub's keys
# and requires its claims to name this repository, this run, this event,
# ci.yml, and for a pull request `main` as the base; the commit it names as
# the workflow's source must carry `git rev-parse HEAD:.github/workflows/ci.yml`
# and the commit it names as checked out must carry this tree.
# Only a yes sets `skip=true`; an API error, an expired record, a failed run or
# anything else it cannot establish answers no, and every gate runs. A direct
# push with no pull request therefore keeps the full validation — unless its
# tree is byte-identical to one CI already passed, which is the same content.
#
# Every validation step carries `if: steps.revalidation.outputs.skip != 'true'`
# and nothing else. Install and Build always run, because publishing needs
# `dist`; the pre-publish consumer install check keeps its version-commit
# condition and runs whatever the skip says, because it measures the packages
# that actually ship, which no earlier run has seen. The step log says which
# path was taken, why, and which CI run it relied on.
#
# `check-workflow-gate-parity.mjs` holds all of that: a gate on one path and
# not the other still fails it, and so does a gate carrying any condition but
# that guard, a guarded step ci.yml does not run, a guard on Install, Build
# or the pre-publish check, or `continue-on-error` on any gate or on a job that
# runs one, in either workflow: a ci.yml gate under it can fail inside a run
# that concludes success, which would record the tree and skip it here too.
on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  # Read workflow runs and artifacts, to find ci.yml's validated-tree record.
  actions: read

jobs:
  release:
    name: Release (Changesets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      # Decides whether the validation below has already been done on these
      # exact bytes. See the header. Never fails the job: a lookup it cannot
      # make answers "not validated", and every gate runs.
      - name: Was this tree already validated by CI
        id: revalidation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          ci_blob=$(git rev-parse 'HEAD:.github/workflows/ci.yml' 2>/dev/null || true)
          echo "commit $GITHUB_SHA, tree $tree, ci.yml blob ${ci_blob:-none}"
          node .github/scripts/find-validated-tree.mjs --repo "$GITHUB_REPOSITORY" --tree "$tree" --ci-blob "$ci_blob"

      - name: Report the validation path
        env:
          SKIP: ${{ steps.revalidation.outputs.skip }}
          REASON: ${{ steps.revalidation.outputs.reason }}
          RUN_URL: ${{ steps.revalidation.outputs.run_url }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "::notice title=Validation skipped::this tree already passed ci.yml ($REASON) — $RUN_URL"
          else
            echo "::notice title=Full validation::${REASON:-the lookup produced no answer}"
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.revalidation.outputs.skip != 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.revalidation.outputs.skip != 'true'
        run: pnpm typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        if: steps.revalidation.outputs.skip != 'true'
        run: pnpm -r test

      # The gates a direct-to-main push would otherwise skip.
      #
      # This job is what validates a push that never saw a pull request, and it
      # ran five of the checks `ci.yml` runs — so fifteen of them applied to
      # branches and to nothing else. A docs page went stale on `main` inside a
      # commit that reported green, which is how the gap was found.
      #
      # The genuinely slow ones stay out on purpose and are named in
      # `check-workflow-gate-parity.mjs`: evals, SDK coverage and the
      # process-level suite cost minutes rather than seconds, and this job runs
      # on every push. That exemption is written down where a check reads it,
      # not left as a difference nobody is comparing.
      - name: The two paths onto main run the same gates
        if: steps.revalidation.outputs.skip != 'true'
        run: |
          node --test scripts/__tests__/check-workflow-gate-parity.test.mjs scripts/__tests__/find-validated-tree.test.mjs
          node .github/scripts/check-workflow-gate-parity.mjs

      - name: Project references match workspace dependencies
        if: steps.revalidation.outputs.skip != 'true'
        run: node .github/scripts/check-project-references.mjs

      - name: External-name audit
        if: steps.revalidation.outputs.skip != 'true'
        run: node --import tsx --test scripts/__tests__/audit-external-names.test.ts && node scripts/audit-external-names.mjs

      - name: Log standard gate
        if: steps.revalidation.outputs.skip != 'true'
        run: node scripts/check-log-standard.mjs

      - name: Local entry-point check
        if: steps.revalidation.outputs.skip != 'true'
        run: node --import tsx --test scripts/__tests__/check-local-entry.test.ts

      - name: Model price catalogue matches its source
        if: steps.revalidation.outputs.skip != 'true'
        run: node scripts/generate-model-prices.mjs --check

      # Hermetic tests for the hand-run generator of the bundled Zen snapshot.
      # The roster itself is refreshed at run time by the CLI, so no gate reads
      # upstream here.
      - name: Zen snapshot generator tests
        if: steps.revalidation.outputs.skip != 'true'
        run: node --import tsx --test scripts/__tests__/generate-zen-models.test.ts

      - name: Installer parses as POSIX sh
        if: steps.revalidation.outputs.skip != 'true'
        run: sh -n install.sh && dash -n install.sh

      - name: SDK test-presence gate
        if: steps.revalidation.outputs.skip != 'true'
        run: node .github/scripts/check-sdk-test-presence.mjs

      - name: Publish-metadata gate
        if: steps.revalidation.outputs.skip != 'true'
        run: node .github/scripts/check-publish-metadata.mjs

      - name: Signature types are exported
        if: steps.revalidation.outputs.skip != 'true'
        run: node .github/scripts/check-signature-types-exported.mjs

      - name: Docs OKF gate
        if: steps.revalidation.outputs.skip != 'true'
        run: pnpm docs:check

      - name: Docs fence gate
        if: steps.revalidation.outputs.skip != 'true'
        run: node tools/check-doc-fences.mjs

      - name: publint (package.json shape)
        if: steps.revalidation.outputs.skip != 'true'
        run: |
          pnpm list -r --depth -1 --json \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{for(const r of JSON.parse(s))if(r.name&&r.path&&r.private!==true&&r.name!=='namzu')console.log(require('path').relative(process.cwd(),r.path))})" \
            | sort > /tmp/publint-targets.txt
          test -s /tmp/publint-targets.txt || { echo "no publishable packages found — the enumeration broke, which would pass this step by checking nothing"; exit 1; }
          echo "publint targets:"; cat /tmp/publint-targets.txt
          while read -r pkg; do
            echo "::group::publint $pkg"
            npx -y publint@latest "$pkg"
            echo "::endgroup::"
          done < /tmp/publint-targets.txt

      # Pre-publish consumer install check. Runs only when this commit is
      # the merged "Version Packages" PR (the one Changesets opens to bump
      # versions + CHANGELOG). For every other main-push the Changesets
      # action only refreshes the Version Packages PR and this gate is
      # skipped — no need to pack every publishable package on unrelated commits.
      #
      # It carries no skip guard and never will: when the validation above is
      # skipped because CI already passed this tree, this still runs, because
      # it measures the packed packages that are about to publish, which no CI
      # run has seen. `check-workflow-gate-parity.mjs` refuses a guard here.
      #
      # Its guard test runs in the same step, ahead of it, exactly as in
      # ci.yml: `scripts/__tests__/` belongs to no package, so `pnpm -r test`
      # cannot reach it and a workflow that does not name it never runs it.
      - name: Pre-publish consumer install check
        if: "${{ startsWith(github.event.head_commit.message, 'chore(release): version packages') }}"
        run: |
          node --import tsx --test scripts/__tests__/verify-consumer-install-snapshot.test.ts
          bash .github/scripts/verify-consumer-install.sh

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          createGithubReleases: true
          # Scoped PAT (Contents + Pull requests: write, this repo only) so the
          # action can OPEN the "Version Packages" PR. The org default GITHUB_TOKEN
          # is read-only AND org policy forbids Actions from creating PRs, so the
          # default token can version/commit/push but NOT open the PR — that was
          # the release-pipeline breakage. Falls back to GITHUB_TOKEN when unset.
          github-token: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          # changesets/action@v1 builds the PR-creating octokit from the
          # GITHUB_TOKEN ENV (the `github-token` input covers only part of the
          # path), so the ENV must also be the scoped PAT — otherwise the default
          # Actions token is used and org policy blocks PR creation.
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # The action inlines a package's whole changelog entry as the release
      # body, and GitHub rejects a body over 125,000 characters. A release
      # that batches many changesets crosses that on its largest package and
      # the step fails — after the publish, so the packages are live and only
      # the notes are missing. `@namzu/sdk@3.0.0` lost its release that way
      # while its ten siblings got theirs.
      #
      # `always()` because the interesting case is precisely the one where
      # the step above failed. Additive by construction: a tag that already
      # has a release is skipped, so this can only fill gaps, never replace
      # what the action wrote.
      - name: Backfill release notes the size limit rejected
        if: always()
        run: node .github/scripts/backfill-github-releases.mjs
        env:
          GH_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
