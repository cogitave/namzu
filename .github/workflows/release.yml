name: Release

# Runs on every push to main — both direct pushes and merge commits from
# PRs. This workflow is self-contained: it runs the full validation
# matrix before touching the Changesets action, so it can stand alone
# without the pre-merge ci.yml run.
#
# Per PR merge cycle:
#   - PR opened:   ci.yml runs (pre-merge gate)
#   - PR merged:   release.yml runs (post-merge validation + publish)
# Total: 2 matrix runs per cycle, not 3 (was: CI-on-PR + CI-on-main + Release).
on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release (Changesets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      # The gates a direct-to-main push would otherwise skip.
      #
      # This job is what validates a push that never saw a pull request, and it
      # ran five of the checks `ci.yml` runs — so fifteen of them applied to
      # branches and to nothing else. A docs page went stale on `main` inside a
      # commit that reported green, which is how the gap was found.
      #
      # The genuinely slow ones stay out on purpose and are named in
      # `check-workflow-gate-parity.mjs`: evals, SDK coverage and the
      # process-level suite cost minutes rather than seconds, and this job runs
      # on every push. That exemption is written down where a check reads it,
      # not left as a difference nobody is comparing.
      - name: The two paths onto main run the same gates
        run: node .github/scripts/check-workflow-gate-parity.mjs

      - name: Project references match workspace dependencies
        run: node .github/scripts/check-project-references.mjs

      - name: External-name audit
        run: node --import tsx --test scripts/__tests__/audit-external-names.test.ts && node scripts/audit-external-names.mjs

      - name: Log standard gate
        run: node scripts/check-log-standard.mjs

      - name: Model price catalogue matches its source
        run: node scripts/generate-model-prices.mjs --check

      - name: Installer parses as POSIX sh
        run: sh -n install.sh && dash -n install.sh

      - name: SDK test-presence gate
        run: node .github/scripts/check-sdk-test-presence.mjs

      - name: Publish-metadata gate
        run: node .github/scripts/check-publish-metadata.mjs

      - name: Signature types are exported
        run: node .github/scripts/check-signature-types-exported.mjs

      - name: Public-surface regression check
        run: node .github/scripts/verify-public-surface.mjs

      - name: Docs standard gate
        run: node tools/check-docs.mjs

      - name: Docs fence gate
        run: node tools/check-doc-fences.mjs

      - name: publint (package.json shape)
        run: |
          for pkg in sdk telemetry computer-use providers/anthropic providers/bedrock providers/http providers/lmstudio providers/ollama providers/openai providers/openrouter; do
            echo "::group::publint packages/$pkg"
            npx -y publint@latest packages/$pkg
            echo "::endgroup::"
          done

      # Pre-publish consumer install check. Runs only when this commit is
      # the merged "Version Packages" PR (the one Changesets opens to bump
      # versions + CHANGELOG). For every other main-push the Changesets
      # action only refreshes the Version Packages PR and this gate is
      # skipped — no need to pack 9 tarballs on unrelated commits.
      - name: Pre-publish consumer install check
        if: "${{ startsWith(github.event.head_commit.message, 'chore(release): version packages') }}"
        run: bash .github/scripts/verify-consumer-install.sh

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          createGithubReleases: true
          # Scoped PAT (Contents + Pull requests: write, this repo only) so the
          # action can OPEN the "Version Packages" PR. The org default GITHUB_TOKEN
          # is read-only AND org policy forbids Actions from creating PRs, so the
          # default token can version/commit/push but NOT open the PR — that was
          # the release-pipeline breakage. Falls back to GITHUB_TOKEN when unset.
          github-token: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          # changesets/action@v1 builds the PR-creating octokit from the
          # GITHUB_TOKEN ENV (the `github-token` input covers only part of the
          # path), so the ENV must also be the scoped PAT — otherwise the default
          # Actions token is used and org policy blocks PR creation.
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # The action inlines a package's whole changelog entry as the release
      # body, and GitHub rejects a body over 125,000 characters. A release
      # that batches many changesets crosses that on its largest package and
      # the step fails — after the publish, so the packages are live and only
      # the notes are missing. `@namzu/sdk@3.0.0` lost its release that way
      # while its ten siblings got theirs.
      #
      # `always()` because the interesting case is precisely the one where
      # the step above failed. Additive by construction: a tag that already
      # has a release is skipped, so this can only fill gaps, never replace
      # what the action wrote.
      - name: Backfill release notes the size limit rejected
        if: always()
        run: node .github/scripts/backfill-github-releases.mjs
        env:
          GH_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
