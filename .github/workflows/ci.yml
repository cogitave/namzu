name: CI

# PR gate. The post-merge validation on `main` lives in release.yml so we
# don't run the same matrix twice per merge cycle. Direct-to-main pushes are
# validated by release.yml's own inline validation before publish.
#
# `merge_group` is what makes this gate mean "validated against what will
# actually be on main", rather than "validated against whatever the branch was
# based on". A merge queue builds each PR on top of the current target head
# plus everything ahead of it in the queue, and reports the result through
# THIS workflow — so without this trigger the queue has no required check to
# wait for and every queued PR either stalls or merges unvalidated.
#
# It is also the fix for a real hole. A PR based on another topic branch never
# matched `branches: [main]`, so it ran no Build & Test at all; when its base
# merged, GitHub retargeted it by firing `pull_request` with action `edited`,
# which is not in the default type set (opened, synchronize, reopened). Such a
# PR could reach a mergeable state having run no code validation, while the UI
# showed other checks passing — which reads as green to anyone not counting
# which checks ran.
#
# `edited` was the tempting one-line fix and is the wrong one: it would also
# fire on every title and description edit, so the gate would burn a full
# matrix on typo corrections while still validating against a stale base. The
# queue validates against the merge result, which is the thing that has to be
# correct.
#
# Harmless until the queue is switched on: `merge_group` events only exist
# when a repository has one. Enabling it on the `main` ruleset is a repository
# setting and therefore a human's call, not this workflow's.
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

concurrency:
  # Never cancel a merge-queue run. `cancel-in-progress` keyed on `ref` is
  # right for a PR — a new push makes the old run's answer irrelevant — but a
  # queue entry's run is the only evidence that the merge result is sound, and
  # cancelling it either stalls the queue or drops the PR from it.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Eight steps below run on ONE leg rather than every leg — the
        # deterministic gates, which read the tree and would answer identically
        # on each, plus the two that install. Which leg carries them is declared
        # HERE, on the entry, instead of being spelled as `node-version == 24`
        # eight times further down.
        #
        # The literal spelling worked and could stop working silently. It named
        # a version that lives in this list, so replacing 24 with a newer
        # runtime — an ordinary, unrelated edit — would leave eight `if`
        # conditions matching nothing. No step fails; they are simply skipped,
        # and a skipped step is green. Eight gates would go quiet in a diff that
        # never mentioned them.
        #
        # Attached to the entry, the flag cannot be separated from the version
        # by accident: whoever changes the runtime is editing the block that
        # carries it. See `docs/conventions/a-check-that-cannot-fail.md` — a
        # gate whose condition can quietly become unsatisfiable is that rule
        # aimed at CI rather than at a test.
        include:
          - node-version: 22
          - node-version: 24
            gates: true

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      # namzu takes its naming from nobody. A design explained by reference
      # to another product has borrowed its shape, and the borrowing
      # outlives the sentence: the next reader reaches for that system's
      # model instead of asking what this one is trying to achieve. Wire
      # values are exempt by path — a driver has to name the service it
      # drives — and the script says exactly where that line falls.
      # Spawns a real node process, so it cannot live in the unit suite: the
      # spawn competes for CPU hard enough to flake the timing-sensitive tests
      # beside it. It proves the one thing an in-process test cannot — that a
      # run survives on its own event-loop footprint, with no test runner
      # holding the loop open for it.
      - name: Process-level regression tests
        run: pnpm --filter @namzu/sdk test:proc
      - name: External-name audit
        run: node scripts/audit-external-names.mjs

      # The installer is the one path with no fallback: it runs before namzu
      # exists, on whatever shell the machine has, and a syntax error in it is
      # discovered by the person who has nothing installed yet. Both shells
      # parse it without executing.
      #
      # What this catches is SYNTAX, and the bound is worth stating because it
      # is narrower than it looks: `dash -n` does NOT reject every bashism.
      # `[[ -n "$x" ]]` parses cleanly under it, because `[[` is read as an
      # ordinary command word and only fails at run time. Measured, not
      # assumed — the first version of this step claimed otherwise.
      #
      # So this gate proves the file parses, not that it is free of bashisms.
      # Catching those needs a linter that is not guaranteed on this runner,
      # and a conditional check that skips when its tool is absent would turn
      # "I cannot establish this" into "this is satisfied" — the failure
      # `docs/conventions/an-optional-dependency-may-not-degrade-a-check.md`
      # exists to prevent. Reviewing the diff is the control for bashisms.
      - name: Installer parses as POSIX sh
        if: matrix.gates
        run: |
          sh -n install.sh
          dash -n install.sh

      # Behaviour regression gate. The harness exists so that a change to a
      # tool description, the deferred-tool top-k, or the compaction
      # threshold ships with a signal behind it — and that signal could not
      # reach CI while the harness was a library function with no runner.
      #
      # Exit codes are load-bearing: 1 is a regression to chase, 2 is a
      # broken harness to fix, 3 is "found nothing to run".
      #
      # Two things kept this from being a gate at all. It invoked
      # `dist/index.js`, which is the package barrel and not the CLI, so the
      # step ran nothing and reported success on every push since it was
      # added. And `namzu eval` exited 0 when a suite never settled — the
      # promise stayed pending, the event loop drained, and node ended on its
      # default code — so even a working invocation could not have failed.
      # Both are fixed; `continue-on-error` is gone with them, because a gate
      # that cannot go red is decoration by its own admission above.
      - name: Evals
        run: node packages/cli/dist/bin.js eval --dir packages/evals --out eval-report.json

      # SDK coverage gate (ses_006-test-coverage-sprint).
      # Runs on one node version only — coverage output is identical across
      # matrix entries, so gating on all four would waste CI time and
      # produce confusing duplicate failures. The gate has two layers:
      #   1. Per-module coverage floors defending named invariants.
      #   2. Structural test-presence rule ensuring every src/ folder is
      #      classified (required | baselineExempt | exempt).
      # Both are non-bypassable by design (no SKIP_* env var).
      - name: SDK coverage (produce summary)
        if: matrix.gates
        run: pnpm --filter @namzu/sdk test:coverage

      - name: SDK coverage floor gate
        if: matrix.gates
        run: node .github/scripts/check-sdk-module-coverage.mjs

      - name: SDK test-presence gate
        if: matrix.gates
        run: node .github/scripts/check-sdk-test-presence.mjs

      # The registry verifies a provenance attestation against
      # `repository.url` and rejects the tarball without it — at publish
      # time, after every sibling package has already gone out. Checking it
      # here costs a second; finding out at the registry costs a release.
      - name: Publish-metadata gate
        if: matrix.gates
        run: node .github/scripts/check-publish-metadata.mjs

      # Pre-publish package validation — runs on every PR + every push to main.
      # Catches cross-package peer-range drift and package.json export shape
      # bugs before they reach a publish tag. Only runs on one node version
      # in the matrix to avoid quadrupling install work.
      - name: Pre-publish consumer install check
        if: matrix.gates
        run: bash .github/scripts/verify-consumer-install.sh

      # Public-surface regression guard (ses_011-sdk-public-surface).
      # Compares `Object.keys(@namzu/sdk)` against a committed baseline.
      # Catches silent drops that .d.ts diffs miss (runtime-only symbols,
      # error classes, zod schemas). Intentional widenings update the
      # baseline in the same commit.
      - name: Public-surface regression check
        if: matrix.gates
        run: node .github/scripts/verify-public-surface.mjs

      - name: publint (package.json shape)
        if: matrix.gates
        run: |
          for pkg in sdk sandbox telemetry computer-use providers/anthropic providers/bedrock providers/http providers/lmstudio providers/ollama providers/openai providers/openrouter; do
            echo "::group::publint packages/$pkg"
            npx -y publint@latest packages/$pkg
            echo "::endgroup::"
          done

  # Documentation gate. Separate from Build & Test for one reason: its drift
  # check compares a document's last commit against its `resource:`'s last
  # commit, and `git log` cannot answer that on the shallow checkout the matrix
  # uses. Rather than return a pass it could not justify, the gate REFUSES on a
  # shallow clone -- so it gets its own job with full history instead of a
  # `fetch-depth: 0` on four matrix entries that do not need it.
  #
  # No dependency install: the gate is stdlib-only node by design, so it runs
  # on the bare tree in seconds and cannot be broken by a lockfile change.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Docs standard gate
        run: node tools/check-docs.mjs
