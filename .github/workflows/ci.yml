name: CI

# PR-only gate. The post-merge validation on `main` lives in release.yml so
# we don't run the same matrix twice per merge cycle. Direct-to-main pushes
# are validated by release.yml's own inline validation before publish.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      # namzu takes its naming from nobody. A design explained by reference
      # to another product has borrowed its shape, and the borrowing
      # outlives the sentence: the next reader reaches for that system's
      # model instead of asking what this one is trying to achieve. Wire
      # values are exempt by path — a driver has to name the service it
      # drives — and the script says exactly where that line falls.
      - name: External-name audit
        run: node scripts/audit-external-names.mjs

      # Behaviour regression gate. The harness exists so that a change to a
      # tool description, the deferred-tool top-k, or the compaction
      # threshold ships with a signal behind it — and that signal could not
      # reach CI while the harness was a library function with no runner.
      #
      # Exit codes are load-bearing: 1 is a regression to chase, 2 is a
      # broken harness to fix, 3 is "found nothing to run".
      #
      # Two things kept this from being a gate at all. It invoked
      # `dist/index.js`, which is the package barrel and not the CLI, so the
      # step ran nothing and reported success on every push since it was
      # added. And `namzu eval` exited 0 when a suite never settled — the
      # promise stayed pending, the event loop drained, and node ended on its
      # default code — so even a working invocation could not have failed.
      # Both are fixed; `continue-on-error` is gone with them, because a gate
      # that cannot go red is decoration by its own admission above.
      - name: Evals
        run: node packages/cli/dist/bin.js eval --dir packages/evals --out eval-report.json

      # SDK coverage gate (ses_006-test-coverage-sprint).
      # Runs on one node version only — coverage output is identical across
      # matrix entries, so gating on all four would waste CI time and
      # produce confusing duplicate failures. The gate has two layers:
      #   1. Per-module coverage floors defending named invariants.
      #   2. Structural test-presence rule ensuring every src/ folder is
      #      classified (required | baselineExempt | exempt).
      # Both are non-bypassable by design (no SKIP_* env var).
      - name: SDK coverage (produce summary)
        if: matrix.node-version == 24
        run: pnpm --filter @namzu/sdk test:coverage

      - name: SDK coverage floor gate
        if: matrix.node-version == 24
        run: node .github/scripts/check-sdk-module-coverage.mjs

      - name: SDK test-presence gate
        if: matrix.node-version == 24
        run: node .github/scripts/check-sdk-test-presence.mjs

      # The registry verifies a provenance attestation against
      # `repository.url` and rejects the tarball without it — at publish
      # time, after every sibling package has already gone out. Checking it
      # here costs a second; finding out at the registry costs a release.
      - name: Publish-metadata gate
        if: matrix.node-version == 24
        run: node .github/scripts/check-publish-metadata.mjs

      # Pre-publish package validation — runs on every PR + every push to main.
      # Catches cross-package peer-range drift and package.json export shape
      # bugs before they reach a publish tag. Only runs on one node version
      # in the matrix to avoid quadrupling install work.
      - name: Pre-publish consumer install check
        if: matrix.node-version == 24
        run: bash .github/scripts/verify-consumer-install.sh

      # Public-surface regression guard (ses_011-sdk-public-surface).
      # Compares `Object.keys(@namzu/sdk)` against a committed baseline.
      # Catches silent drops that .d.ts diffs miss (runtime-only symbols,
      # error classes, zod schemas). Intentional widenings update the
      # baseline in the same commit.
      - name: Public-surface regression check
        if: matrix.node-version == 24
        run: node .github/scripts/verify-public-surface.mjs

      - name: publint (package.json shape)
        if: matrix.node-version == 24
        run: |
          for pkg in sdk sandbox telemetry computer-use providers/anthropic providers/bedrock providers/http providers/lmstudio providers/ollama providers/openai providers/openrouter; do
            echo "::group::publint packages/$pkg"
            npx -y publint@latest packages/$pkg
            echo "::endgroup::"
          done
