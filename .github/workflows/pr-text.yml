name: PR text

# What a pull request carries beyond its final tree: its title, its body, its
# head branch's name, and each of its commits' message, author, committer and
# added lines and paths. A squash merge writes the commit messages, the title
# and a `Co-authored-by` trailer for each commit author into the commit that
# lands on `main`, and a downstream consumer's name reached the history both
# ways, from a PR description and from work addresses in those trailers (#530).
# A rebase merge lands every commit as it is, so a name one commit adds and a
# later one removes is on `main` although the final tree is clean; and
# `refs/pull/<n>/head` keeps every commit reachable whatever the merge. The
# final tree is audited by the External-name audit step in ci.yml and
# release.yml; this reads each commit on its own, so this one job covers
# everything that issue lists and is the check to require on `main`.
#
# A workflow of its own because it has to run on `edited`. A title or body
# changed after the last push is exactly the text a squash merge takes, and
# ci.yml deliberately does not listen for `edited` — its header says why: a
# description edit would burn the whole matrix. This costs a checkout and one
# node process, so `edited` is cheap here. It also fires when a pull request
# is retargeted onto `main`, which is when one based on another branch starts
# to matter.
#
# The list is the repository secret NAMZU_DOWNSTREAM_NAMES, passed to the one
# step that reads it, and in no file in any form: a committed list, even of
# digests, is the trace the check removes. Without it the step fails with
# "NAMZU_DOWNSTREAM_NAMES is not set", except on a pull request from a fork,
# which GitHub gives no secrets: there it is skipped with a notice saying so.
#
# `merge_group`: in a merge queue the commits between the queue's base and head
# are the ones about to land, with the messages they will land with, and a
# required check has to report on the queue's run or the queue stalls.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main]

concurrency:
  # A newer edit or push makes an older answer irrelevant; a queue run is the
  # only evidence for its merge result and is never cancelled.
  group: pr-text-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  downstream-names:
    name: Downstream names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Every commit between the base and the head is read on its own,
          # against its parents; a depth-1 checkout has none of them.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # The title and body are read from the event file by the script, never
      # interpolated into this shell: they are text anyone opening a pull
      # request chooses.
      - name: No downstream name in the PR text, commits or added lines
        env:
          NAMZU_DOWNSTREAM_NAMES: ${{ secrets.NAMZU_DOWNSTREAM_NAMES }}
        run: node scripts/check-downstream-names.mjs --event "$GITHUB_EVENT_PATH"
