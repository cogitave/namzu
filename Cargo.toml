# The Rust workspace. It holds the native helpers Namzu ships next to the
# TypeScript packages; the pnpm workspace does not see it. Language-neutral
# test data for these crates lives in `conformance/`.
[workspace]
resolver = "3"
members = ["crates/namzu-win-core", "crates/namzu-win"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "FSL-1.1-MIT"
repository = "https://github.com/cogitave/namzu"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# A small, self-contained executable: the helper is a file a person may
# inspect, so it is not packed, stripped of its symbols only, and aborts on a
# panic instead of unwinding through a protocol loop.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
